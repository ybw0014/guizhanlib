name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties)
          echo "version=$version" >> "$GITHUB_ENV"
          echo "Releasing version: $version"
          if [ "${version%-SNAPSHOT}" != "$version" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare publish credentials
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_SECRET_KEYRING_BASE64: ${{ secrets.SIGNING_SECRET_KEYRING_BASE64 }}
        run: |
          echo "${SIGNING_SECRET_KEYRING_BASE64}" | base64 --decode > "${RUNNER_TEMP}/secring.gpg"
          mkdir -p ~/.gradle
          {
            echo "sonatypeUsername=${SONATYPE_USERNAME}"
            echo "sonatypePassword=${SONATYPE_PASSWORD}"
            echo "signing.keyId=${SIGNING_KEY_ID}"
            echo "signing.password=${SIGNING_PASSWORD}"
            echo "signing.secretKeyRingFile=${RUNNER_TEMP}/secring.gpg"
          } >> ~/.gradle/gradle.properties

      - name: Publish to Maven Central
        run: ./gradlew publish

      - name: Create tag and GitHub release
        if: steps.version.outputs.release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ env.version }}
        run: |
          awk -v heading="## ${VERSION}" '
            $0 == heading { inside = 1; next }
            /^## / && inside { exit }
            inside { print }
          ' CHANGELOG.md > "${RUNNER_TEMP}/notes.md"
          if [ ! -s "${RUNNER_TEMP}/notes.md" ]; then
            echo "::error::No CHANGELOG section found for ${VERSION}"
            exit 1
          fi
          git tag -a "v${VERSION}" -m "${VERSION}" "${GITHUB_SHA}"
          git push origin "v${VERSION}"
          gh release create "v${VERSION}" --title "${VERSION}" --notes-file "${RUNNER_TEMP}/notes.md"
